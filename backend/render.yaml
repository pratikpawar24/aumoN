# render.yaml — place this in ROOT of repo (aumoN/render.yaml)
services:
  - type: web
    name: aumo-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000