version: '3.9'

services:
  # ── Frontend (React) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aumo_frontend
    ports:
      - '3000:3000'
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_AI_URL=http://localhost:7860
    depends_on:
      - backend
    networks:
      - aumo_network
    restart: unless-stopped

  # ── Backend (Node.js/Express) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aumo_backend
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://ai-routing:7860
      - FRONTEND_URL=http://localhost:3000
      - ORS_API_KEY=${ORS_API_KEY}
    depends_on:
      - ai-routing
    networks:
      - aumo_network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── AI Routing Service (Python/FastAPI) ───────────────────────────────────
  ai-routing:
    build:
      context: ./ai-routing
      dockerfile: Dockerfile
    container_name: aumo_ai_routing
    ports:
      - '7860:7860'
    environment:
      - PORT=7860
    networks:
      - aumo_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7860/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  aumo_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local